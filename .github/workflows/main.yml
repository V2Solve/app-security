name: Upload to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::469092901956:role/GithubActionRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp readme.md s3://v2sbucket/
